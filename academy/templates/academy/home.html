<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Academy</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: white; }
        nav { background: #1e293b; padding: 20px 50px; display:flex; justify-content:space-between; align-items:center; }
        nav h1 { color: #38bdf8; }
        nav a { color: white; text-decoration:none; margin-left:20px; }
        .hero { text-align:center; padding: 100px 20px; }
        .hero h1 { font-size: 50px; margin-bottom: 20px; }
        .hero h1 span { color: #38bdf8; }
        .hero p { color: #94a3b8; font-size: 18px; margin-bottom: 30px; }
        .hero button { background: #38bdf8; border:none; padding: 15px 40px; font-size:18px; border-radius: 30px; cursor:pointer; font-weight:bold; }
        .cards { display:flex; gap:20px; justify-content:center; padding: 50px; flex-wrap:wrap; }
        .card { background: #1e293b; padding: 30px; border-radius: 15px; width: 300px; }
        .card h3 { color: #38bdf8; margin-bottom:10px; }
        .card p { color: #94a3b8; }
    </style>
</head>
<body>
    <nav>
        <h1>🐍 Python Academy</h1>
        <div>
            <a href="#">الرئيسية</a>
            <a href="#">الكورسات</a>
            <a href="#">تواصل معنا</a>
        </div>
    </nav>
    <div class="hero">
        <h1>اتعلم <span>Python</span> من الصفر للاحتراف</h1>
        <p>أكاديمية متكاملة لتعليم البرمجة بأسلوب بسيط وعملي</p>
        <button>ابدأ التعلم الآن مجاناً</button>
    </div>
    <div class="cards">
        <div class="card">
            <h3>🐍 أساسيات Python</h3>
            <p>اتعلم المتغيرات والدوال والـ Loops من الصفر</p>
        </div>
        <div class="card">
            <h3>🌐 تطوير مواقع</h3>
            <p>ابني مواقع حقيقية باستخدام Django</p>
        </div>
        <div class="card">
            <h3>🤖 ذكاء اصطناعي</h3>
            <p>ادخل عالم الـ AI والمشاريع العملية</p>
        </div>
    </div>
</body>
</html>
